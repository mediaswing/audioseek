[package]
name = "audioseek"
version = "1.1.0"
edition = "2024"
description = "Podcast Batch Downloader: an accessible way to download podcast episodes from an OPML file"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav", "symphonia-mp3", "symphonia-wav"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.42", features = ["escape-html"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rfd = "0.17"
dirs = "7"
tempfile = "3"
log = "0.4"
anyhow = "1"

[build-dependencies]
# Embeds the icon in the Windows executable.
winresource = "0.1"

# Building the .deb (src/package/linux.rs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tar = "0.4"
# Compresses the .deb. Static, so the app doesn't link the system liblzma.
xz2 = { version = "0.1", features = ["static"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
