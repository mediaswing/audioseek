# Builds the release downloads when a version tag (for example v0.1.0)
# is pushed, and publishes them on a GitHub release whose text comes from the
# matching section of CHANGELOG.md. Each download is first submitted to
# VirusTotal, and a table of scan links is added to the release notes. Based
# on the Speech Output Engine's release workflow.
#
# Requires the repository secret VT_API_KEY (a VirusTotal API key).
#
# Packaging:
#   * macOS: `audioseek --package-macos dist` (src/package/macos.rs) builds the
#     .app bundle, signs it ad hoc and wraps it in an installer package (.pkg)
#     that puts it in /Applications. The macos job tests installing it.
#   * Linux: `audioseek --package-deb dist` (src/package/linux.rs) writes the
#     .deb, which the linux job tests installing and then renames to use
#     hyphens instead of underscores.
#   * Windows: the exe is linked with the C runtime built in (see
#     .cargo/config.toml), so it needs no DLLs, which the windows job checks.
#     WiX Toolset then builds an MSI installer for it, described by
#     src/installer/audioseek.wxs, and the job tests installing, upgrading and
#     uninstalling it. The MSI's version comes from the tag, so the tag must be
#     three numbers such as v0.1.0. The job runs twice, building one MSI for
#     x64 PCs and one for Arm PCs, each on a runner of its own kind so that
#     the tests run the installed app natively.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The MSI's version comes from the tag, but the app's own version (shown by
  # --version, and used to name the .deb and .pkg) comes from Cargo.toml. So
  # check they match before anything is built.
  version:
    name: Check the tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(awk -F'"' '/^\[/ { section = $0 } section == "[package]" && /^version *=/ { print $2; exit }' Cargo.toml)
          if [ "$tag" != "$cargo" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version \"$cargo\" in Cargo.toml. Set the version in Cargo.toml to $tag (and update Cargo.lock), or tag v$cargo instead."
            exit 1
          fi
          echo "Version: $cargo"

  windows:
    name: Windows (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      # Let both builds finish, so a failure in one doesn't hide the other's.
      fail-fast: false
      matrix:
        include:
          # arch names the download; msvc is the Visual C++ folder name and
          # wix the MSI's platform.
          - arch: x86_64
            runner: windows-latest
            msvc: x64
            wix: x64
          - arch: aarch64
            runner: windows-11-arm
            msvc: arm64
            wix: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      # The MSI's version comes from the tag. Windows Installer versions are
      # three numbers, the first two at most 255 and the third at most 65535,
      # with nothing after them, so check the tag before the build.
      - name: Check the tag can be an MSI version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$' -or
              [int]$Matches[1] -gt 255 -or [int]$Matches[2] -gt 255 -or [int]$Matches[3] -gt 65535) {
            Write-Host "::error::The tag $env:GITHUB_REF_NAME can't be used as a Windows Installer version. Use a tag such as v0.1.0: three numbers, the first two at most 255 and the third at most 65535, with no suffix such as -beta."
            exit 1
          }
          Write-Host "MSI version: $version"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-rust
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The exe should need no DLLs beyond those that are part of Windows. If
      # it imports the Visual C++ runtime, the static runtime setting in
      # .cargo/config.toml has stopped working, and the installed app would
      # fail to start on PCs without the Redistributable.
      - name: Stage the exe
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Host*\${{ matrix.msvc }}\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin not found under $vs" }
          $imports = & $dumpbin.FullName /nologo /dependents target\release\audioseek.exe |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -like '*.dll' }
          Write-Host "The exe imports:" ($imports -join ', ')
          $runtime = $imports | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib)' }
          if ($runtime) { throw "The exe imports the Visual C++ runtime: $($runtime -join ', ')" }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "audioseek-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "stage\$folder", dist | Out-Null
          Copy-Item target\release\audioseek.exe "stage\$folder"
          # The GPL must go with the program. .txt so Notepad opens it.
          Copy-Item LICENSE "stage\$folder\LICENSE.txt"
      # WiX Toolset builds the MSI. The version is pinned so that every
      # release is built the same way.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wix = "$env:RUNNER_TEMP\wix"
          dotnet tool install wix --version 6.0.2 --tool-path $wix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wix\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix >> $env:GITHUB_PATH
      # src\installer\audioseek.wxs describes the MSI. wix build also runs the
      # Windows Installer validation checks (ICEs).
      - name: Build the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "audioseek-$version-windows-${{ matrix.arch }}"
          $stage = (Resolve-Path "stage\$folder").Path
          wix build src\installer\audioseek.wxs -arch ${{ matrix.wix }} -culture en-US -ext WixToolset.UI.wixext -pdbtype none `
            -d "Version=$version" -d "StageDir=$stage" -o "dist\$folder.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Checks that the MSI holds exactly the staged exe, has the right
      # version, name and upgrade code, and installs without administrator
      # rights.
      - name: Check the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "audioseek-$version-windows-${{ matrix.arch }}"
          $msi = (Resolve-Path "dist\$folder.msi").Path
          $upgradeCode = '{' + ([xml](Get-Content src\installer\audioseek.wxs)).Wix.Package.UpgradeCode + '}'
          # The Windows Installer COM objects only work through late binding.
          function Msi($object, $name, $kind, [object[]]$arguments) {
            $object.GetType().InvokeMember($name, $kind, $null, $object, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = Msi $installer OpenDatabase InvokeMethod @($msi, 0)
          function Query($sql) {
            $view = Msi $db OpenView InvokeMethod @($sql)
            Msi $view Execute InvokeMethod @() | Out-Null
            while ($record = Msi $view Fetch InvokeMethod @()) { Msi $record StringData GetProperty @(1) }
            Msi $view Close InvokeMethod @() | Out-Null
          }
          function Property($name) { Query "SELECT Value FROM Property WHERE Property = '$name'" }

          $problems = @()
          # File names are stored as "SHORT~1.EXE|long name.exe".
          $inMsi = Query 'SELECT FileName FROM File' | ForEach-Object { ($_ -split '\|')[-1] } | Sort-Object
          $staged = (Get-ChildItem "stage\$folder").Name | Sort-Object
          Write-Host "Files in the MSI:" ($inMsi -join ', ')
          if (Compare-Object @($inMsi) @($staged)) { $problems += "The MSI holds $($inMsi -join ', ') but the staged files are $($staged -join ', ')" }
          $expected = @{ ProductVersion = $version; UpgradeCode = $upgradeCode; ProductName = 'Podcast Batch Downloader'; Manufacturer = 'The audioseek contributors' }
          foreach ($name in $expected.Keys) {
            $value = Property $name
            Write-Host "${name}: $value"
            if ($value -ne $expected[$name]) { $problems += "$name is '$value', not '$($expected[$name])'" }
          }
          if (Property ALLUSERS) { $problems += 'ALLUSERS is set, so the MSI would not install for the current user only' }
          # Bit 3 of the word count says that administrator rights aren't needed.
          $summary = Msi $installer SummaryInformation GetProperty @($msi, 0)
          if (-not ((Msi $summary Property GetProperty @(15)) -band 8)) { $problems += 'The MSI asks for administrator rights' }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      # Installs an older build of the same MSI, upgrades it to this one,
      # starts the installed app and uninstalls it, checking that the user's
      # settings and feeds are left alone throughout. The runner's account is
      # an administrator, so this can't show that ordinary accounts need no
      # administrator rights; the check above covers that.
      - name: Test installing, upgrading and uninstalling the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "audioseek-$version-windows-${{ matrix.arch }}"
          $msi = (Resolve-Path "dist\$folder.msi").Path
          $stage = (Resolve-Path "stage\$folder").Path
          $upgradeCode = '{' + ([xml](Get-Content src\installer\audioseek.wxs)).Wix.Package.UpgradeCode + '}'
          $dir = "$env:LOCALAPPDATA\Programs\AudioSeek"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Podcast Batch Downloader.lnk"
          function Msi($object, $name, $kind, [object[]]$arguments) {
            $object.GetType().InvokeMember($name, $kind, $null, $object, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          # PowerShell unrolls the list of product codes into strings.
          function Installed {
            foreach ($code in @(Msi $installer RelatedProducts GetProperty @($upgradeCode))) {
              Msi $installer ProductInfo GetProperty @($code, 'VersionString')
            }
          }
          function Msiexec($arguments, $log) {
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $log -Tail 60
              throw "msiexec $arguments failed with exit code $($p.ExitCode)"
            }
          }
          function Check($ok, $message) { if (-not $ok) { throw $message } }

          # Stand-ins for the settings and list of feeds the app keeps.
          $kept = "$env:APPDATA\AudioSeek\settings.json", "$env:APPDATA\AudioSeek\feeds.json"
          $kept | ForEach-Object { New-Item -ItemType File -Force $_ -Value '{}' | Out-Null }
          function Check-Kept($when) {
            $kept | ForEach-Object { Check (Test-Path $_) "$_ was removed $when" }
          }

          $old = "$env:RUNNER_TEMP\audioseek-old.msi"
          wix build src\installer\audioseek.wxs -arch ${{ matrix.wix }} -culture en-US -ext WixToolset.UI.wixext -pdbtype none `
            -d "Version=0.0.1" -d "StageDir=$stage" -o $old
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Msiexec @('/i', "`"$old`"") "$env:RUNNER_TEMP\install-old.log"
          Check ((Installed) -eq '0.0.1') "The older MSI did not install: $(Installed)"
          Check-Kept 'by installing'

          Msiexec @('/i', "`"$msi`"") "$env:RUNNER_TEMP\upgrade.log"
          $versions = @(Installed)
          Check ($versions.Count -eq 1 -and $versions[0] -eq $version) "After upgrading, the installed versions are: $($versions -join ', ')"
          Check-Kept 'by upgrading'
          $files = (Get-ChildItem $dir).Name | Sort-Object
          Check (-not (Compare-Object @($files) @((Get-ChildItem $stage).Name | Sort-Object))) "$dir holds: $($files -join ', ')"
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          Check ($target -eq "$dir\audioseek.exe") "The Start menu shortcut points at '$target'"
          # The app can't start if Windows can't find a DLL it needs.
          $out = "$env:RUNNER_TEMP\version.txt"
          $p = Start-Process $target -ArgumentList '--version' -RedirectStandardOutput $out -Wait -PassThru
          Check ($p.ExitCode -eq 0) "The installed app failed to start (exit code $($p.ExitCode))"
          Write-Host "Installed app says:" (Get-Content $out)

          Msiexec @('/x', "`"$msi`"") "$env:RUNNER_TEMP\uninstall.log"
          Check (-not (Installed)) "Still installed after uninstalling: $(Installed)"
          Check (-not (Test-Path $dir)) "$dir is still there after uninstalling"
          Check (-not (Test-Path $shortcut)) 'The Start menu shortcut is still there after uninstalling'
          Check (-not (Test-Path HKCU:\Software\AudioSeek\Installer)) 'HKCU\Software\AudioSeek\Installer is still there after uninstalling'
          Check-Kept 'by uninstalling'

          $kept | ForEach-Object { Remove-Item $_ }
          Write-Host 'Installed, upgraded, started and uninstalled; settings and feeds were kept.'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.msi
          if-no-files-found: error

  linux:
    name: Ubuntu .deb (amd64)
    needs: version
    # The oldest supported Ubuntu LTS, so the package installs on 22.04 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # Includes src/package/linux.rs's test, which checks a .deb with dpkg-deb.
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: target/release/audioseek --package-deb dist
      # apt installs the package's dependencies too, so this also checks that
      # they all exist on the oldest Ubuntu the package is for.
      - name: Test installing the package
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/*.deb
          echo "Installed app says: $(/usr/bin/audioseek --version)"
          desktop-file-validate /usr/share/applications/audioseek.desktop || true
          sudo apt-get remove -y audioseek
          test ! -e /usr/bin/audioseek
      # Debian names the file audioseek_<version>_<arch>.deb; use hyphens to
      # match the Windows and macOS downloads.
      - name: Rename the .deb with hyphens
        run: |
          for f in dist/*.deb; do
            mv "$f" "dist/$(basename "$f" | tr _ -)"
          done
          ls dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  macos:
    name: macOS .pkg (Apple Silicon)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: target/aarch64-apple-darwin/release/audioseek --package-macos dist
      - name: Test installing the package
        run: |
          set -euo pipefail
          pkg=$(ls dist/*.pkg)
          sudo installer -pkg "$pkg" -target /
          app="/Applications/Podcast Batch Downloader.app"
          codesign --verify --strict --verbose=2 "$app"
          echo "Installed app says: $("$app/Contents/MacOS/audioseek" --version)"
          pkgutil --pkg-info io.github.mediaswing.audioseek
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read release notes from CHANGELOG.md
        uses: ffurrer2/extract-release-notes@v3.1.0
        with:
          release_notes_file: changelog-notes.md
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # Scan before publishing so the results can go into the release notes.
      # A VirusTotal outage must not block a release, so failures are allowed
      # and the scan table is simply left out.
      - name: Scan downloads with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            artifacts/*.deb
            artifacts/*.msi
            artifacts/*.pkg
          # The free VirusTotal API allows 4 requests a minute.
          request_rate: 4
      - name: Write release notes
        uses: actions/github-script@v9.0.0
        env:
          SCAN_OUTCOME: ${{ steps.virustotal.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            // The changelog section may be empty (or absent).
            let notes = fs.existsSync('changelog-notes.md')
              ? fs.readFileSync('changelog-notes.md', 'utf8').trim()
              : '';

            if (process.env.SCAN_OUTCOME === 'success') {
              const platform = (name) =>
                name.endsWith('-aarch64.msi') ? 'Windows installer, Arm' :
                name.endsWith('.msi') ? 'Windows installer, x64' :
                name.endsWith('.deb') ? 'Ubuntu' :
                name.includes('-macos-') ? 'Apple Silicon' : '';
              const rows = fs.readdirSync('artifacts').sort().map((name) => {
                const sha = crypto.createHash('sha256')
                  .update(fs.readFileSync(path.join('artifacts', name)))
                  .digest('hex');
                // The permanent report for this exact file.
                const url = `https://www.virustotal.com/gui/file/${sha}`;
                return `| \`${name}\` (${platform(name)}) | \`${sha}\` | [View scan](${url}) |`;
              });
              const table = [
                '## VirusTotal scans',
                '',
                '| Download | SHA-256 | Report |',
                '| --- | --- | --- |',
                ...rows,
              ].join('\n');
              notes = notes ? `${notes}\n\n${table}` : table;
            } else {
              core.warning('VirusTotal scan failed; publishing without scan results.');
            }

            fs.writeFileSync('release-notes.md', notes + '\n');
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.deb
            artifacts/*.msi
            artifacts/*.pkg
          fail_on_unmatched_files: true
